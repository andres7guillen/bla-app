<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5 col-lg-4">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Bla App
                    </h2>

                    <h4 class="text-center mb-4">
                        Login
                    </h4>


                    <form [formGroup]="form" (ngSubmit)="submit()">



                        <div class="mb-3">

                            <label for="email" class="form-label">

                                Email

                            </label>

                            <input id="email" type="email" class="form-control" formControlName="email"
                                placeholder="Enter your email" [class.is-invalid]="
                  form.controls['email'].invalid &&
                  form.controls['email'].touched
                ">


                            <div class="invalid-feedback" *ngIf="
                  form.controls.email.invalid &&
                  form.controls.email.touched
                ">

                                <span *ngIf="
                    form.controls.email.errors?.['required']
                  ">

                                    Email is required.

                                </span>

                                <span *ngIf="
                    form.controls.email.errors?.['email']
                  ">

                                    Please enter a valid email.

                                </span>

                            </div>

                        </div>



                        <div class="mb-3">

                            <label for="password" class="form-label">

                                Password

                            </label>

                            <input id="password" type="password" class="form-control" formControlName="password"
                                placeholder="Enter your password" [class.is-invalid]="
                  form.controls['password'].invalid &&
                  form.controls['password'].touched">


                            <div class="invalid-feedback" *ngIf="
                  form.controls.password.invalid &&
                  form.controls.password.touched
                ">

                                Password is required and must contain
                                at least 6 characters.

                            </div>

                        </div>



                        <div class="d-grid">

                            <button type="submit" class="btn btn-primary" [disabled]="loading">

                                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2">
                                </span>

                                {{ loading ? 'Logging in...' : 'Login' }}

                            </button>

                        </div>

                    </form>


                    <div class="text-center mt-4">

                        <span>
                            Don't have an account?
                        </span>

                        <div class="mt-3">
                            <a routerLink="/register" class="btn btn-secondary">
                                Register
                            </a>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
